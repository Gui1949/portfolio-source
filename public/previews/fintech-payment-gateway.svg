<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #070b14; }
      .nav-bg { fill: #0d1527; stroke: #1e293b; stroke-width: 1; }
      .card-bg { fill: #0d1424; stroke: #1e2c45; stroke-width: 1; }
      .card-accent { fill: #111a30; stroke: #2a3e63; stroke-width: 1; }
      .inner-box { fill: #080c16; stroke: #192338; stroke-width: 1; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-feature-settings: "tnum" 1; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-title { fill: #f8fafc; font-size: 14px; font-weight: 600; }
      .text-sub { fill: #94a3b8; font-size: 11px; }
      .text-muted { fill: #64748b; font-size: 11px; }
      .text-num-lg { fill: #38bdf8; font-size: 20px; font-weight: 700; }
      .text-val { fill: #e2e8f0; font-size: 12px; }
      .badge-spi { fill: #032e2b; stroke: #0d9488; }
      .badge-spi-text { fill: #2dd4bf; font-size: 10px; font-weight: 700; }
      .badge-warn { fill: #451a03; stroke: #d97706; }
      .badge-warn-text { fill: #fbbf24; font-size: 10px; font-weight: 700; }
      .badge-alert { fill: #3f0b0b; stroke: #ef4444; }
      .badge-alert-text { fill: #fca5a5; font-size: 10px; font-weight: 700; }
      .div-line { stroke: #1e2c45; stroke-width: 1; }
      .bar-active { fill: #0284c7; }
      .bar-pending { fill: #334155; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="580" rx="12" class="bg"/>

  <!-- Banking Top Navigation Bar -->
  <rect width="1000" height="52" rx="12" class="nav-bg"/>
  <rect y="40" width="1000" height="12" fill="#0d1527"/>
  
  <g transform="translate(24, 16)">
    <!-- Shield / Vault Brand Icon -->
    <rect width="22" height="22" rx="4" fill="#0284c7"/>
    <path d="M11 4 L18 7 V12 C18 16 11 19 11 19 C11 19 4 16 4 12 V7 Z" fill="#ffffff" transform="scale(0.8) translate(3, 2)"/>
    
    <text x="32" y="16" class="sans text-title" letter-spacing="0.5">AEGISPAY <tspan fill="#38bdf8" font-size="11px" font-weight="400">| TREASURY &amp; SETTLEMENT ENGINE</tspan></text>
  </g>

  <g transform="translate(620, 16)">
    <rect width="125" height="22" rx="4" fill="#0f1f38" stroke="#1d4ed8" stroke-width="1"/>
    <circle cx="10" cy="11" r="3.5" fill="#38bdf8"/>
    <text x="20" y="15" class="mono text-sub" fill="#93c5fd" font-size="10px">BACEN SPI : ONLINE</text>

    <rect x="135" width="105" height="22" rx="4" fill="#0d2818" stroke="#059669" stroke-width="1"/>
    <circle cx="145" cy="11" r="3.5" fill="#10b981"/>
    <text x="155" y="15" class="mono text-sub" fill="#6ee7b7" font-size="10px">EDI CNAB 240</text>

    <rect x="250" width="95" height="22" rx="4" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
    <text x="258" y="15" class="mono text-sub" fill="#c7d2fe" font-size="10px">HMAC-SHA256</text>
  </g>
  <line x1="0" y1="52" x2="1000" y2="52" class="div-line"/>

  <!-- Left Sidebar: Settlement Schedule & Liquidation Pipeline (D+0, D+1, D+30) -->
  <g transform="translate(20, 68)">
    <rect width="280" height="492" rx="8" class="card-bg"/>
    
    <text x="16" y="26" class="sans text-title" font-size="12px">CRONOGRAMA DE LIQUIDAÇÕES</text>
    <text x="16" y="42" class="sans text-muted">Conciliação de recebíveis por janela</text>
    <line x1="16" y1="54" x2="264" y2="54" class="div-line"/>

    <!-- Pipeline Step 1: D+0 Pix Liquidado -->
    <g transform="translate(16, 68)">
      <rect width="248" height="64" rx="6" class="card-accent"/>
      <rect x="0" y="0" width="4" height="64" rx="2" fill="#10b981"/>
      <text x="14" y="20" class="mono text-sub" fill="#34d399">D+0 · PIX INSTANTÂNEO</text>
      <text x="14" y="44" class="mono text-num-lg" font-size="16px" fill="#f8fafc">R$ 142.850,00</text>
      <rect x="168" y="10" width="70" height="18" rx="3" class="badge-spi"/>
      <text x="203" y="23" text-anchor="middle" class="mono badge-spi-text">COMPENSADO</text>
    </g>

    <!-- Pipeline Step 2: D+1 Cartão Débito -->
    <g transform="translate(16, 142)">
      <rect width="248" height="64" rx="6" class="card-accent"/>
      <rect x="0" y="0" width="4" height="64" rx="2" fill="#0284c7"/>
      <text x="14" y="20" class="mono text-sub" fill="#38bdf8">D+1 · DÉBITO CIP / B3</text>
      <text x="14" y="44" class="mono text-num-lg" font-size="16px" fill="#f8fafc">R$ 89.420,00</text>
      <rect x="175" y="10" width="63" height="18" rx="3" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
      <text x="206" y="23" text-anchor="middle" class="mono" fill="#7dd3fc" font-size="10px" font-weight="700">EM PROCESS.</text>
    </g>

    <!-- Pipeline Step 3: D+30 Cartão Crédito Parcelado -->
    <g transform="translate(16, 216)">
      <rect width="248" height="64" rx="6" class="card-accent"/>
      <rect x="0" y="0" width="4" height="64" rx="2" fill="#eab308"/>
      <text x="14" y="20" class="mono text-sub" fill="#fde047">D+30 · CRÉDITO PARCELADO</text>
      <text x="14" y="44" class="mono text-num-lg" font-size="16px" fill="#f8fafc">R$ 312.980,00</text>
      <rect x="170" y="10" width="68" height="18" rx="3" class="badge-warn"/>
      <text x="204" y="23" text-anchor="middle" class="mono badge-warn-text">AGENDA FUTURA</text>
    </g>

    <!-- Multi-Acquirer Split Chart -->
    <g transform="translate(16, 296)">
      <text x="0" y="16" class="mono text-muted" font-size="10px">SHARE POR ADQUIRENTE (MDR AUDITADO)</text>
      
      <!-- Cielo Bar -->
      <text x="0" y="38" class="mono text-sub">Stone (EDI 240)</text>
      <text x="248" y="38" text-anchor="end" class="mono text-sub">54% · 1.89%</text>
      <rect x="0" y="46" width="248" height="6" rx="3" fill="#1e293b"/>
      <rect x="0" y="46" width="134" height="6" rx="3" fill="#0284c7"/>

      <!-- Cielo Bar -->
      <text x="0" y="70" class="mono text-sub">Cielo (API V3)</text>
      <text x="248" y="70" text-anchor="end" class="mono text-sub">32% · 2.14%</text>
      <rect x="0" y="78" width="248" height="6" rx="3" fill="#1e293b"/>
      <rect x="0" y="78" width="79" height="6" rx="3" fill="#0d9488"/>

      <!-- Rede Bar -->
      <text x="0" y="102" class="mono text-sub">Rede (Webhook)</text>
      <text x="248" y="102" text-anchor="end" class="mono text-sub">14% · 2.45%</text>
      <rect x="0" y="110" width="248" height="6" rx="3" fill="#1e293b"/>
      <rect x="0" y="110" width="35" height="6" rx="3" fill="#eab308"/>
    </g>

    <!-- Integrity Footer -->
    <g transform="translate(16, 440)">
      <rect width="248" height="36" rx="4" class="inner-box"/>
      <text x="10" y="16" class="mono text-muted" font-size="9px">ARITMÉTICA PRECISA: INTEIROS (CENTS)</text>
      <text x="10" y="28" class="mono" fill="#38bdf8" font-size="9px">ZERO TOLERÂNCIA FLOATING-POINT BUG</text>
    </g>
  </g>

  <!-- Right Area: Treasury Reconciliation Ledger & Dispute Resolution -->
  <g transform="translate(312, 68)">
    <rect width="668" height="492" rx="8" class="card-bg"/>

    <!-- KPI Metric Cards -->
    <g transform="translate(18, 16)">
      <!-- KPI 1 -->
      <rect width="204" height="60" rx="6" class="card-accent"/>
      <text x="14" y="20" class="sans text-muted">VOL. LÍQUIDO CONCILIADO</text>
      <text x="14" y="46" class="mono text-num-lg" fill="#38bdf8">R$ 545.250,00</text>

      <!-- KPI 2 -->
      <rect x="216" width="204" height="60" rx="6" class="card-accent"/>
      <text x="230" y="20" class="sans text-muted">MDR AUDITADO TOTAL</text>
      <text x="230" y="46" class="mono text-num-lg" fill="#f8fafc">R$ 11.450,22</text>

      <!-- KPI 3 -->
      <rect x="432" width="200" height="60" rx="6" class="card-accent"/>
      <text x="446" y="20" class="sans text-muted">DIVERGÊNCIA RETIDA</text>
      <text x="446" y="46" class="mono text-num-lg" fill="#ef4444">-R$ 10,78 <tspan font-size="11px" font-weight="400" fill="#fca5a5">(1 Caso)</tspan></text>
    </g>

    <!-- Settlement Ledger Table -->
    <g transform="translate(18, 92)">
      <rect width="632" height="236" rx="6" class="inner-box"/>

      <!-- Table Header -->
      <rect width="632" height="30" rx="6" fill="#131c2e"/>
      <rect y="20" width="632" height="10" fill="#131c2e"/>
      <text x="12" y="19" class="mono text-muted" font-size="10px">NSU / AUTH CODE</text>
      <text x="130" y="19" class="mono text-muted" font-size="10px">CANAL</text>
      <text x="220" y="19" class="mono text-muted" font-size="10px">VALOR BRUTO</text>
      <text x="325" y="19" class="mono text-muted" font-size="10px">TAXA ESPERADA</text>
      <text x="435" y="19" class="mono text-muted" font-size="10px">COBRADO ADQ.</text>
      <text x="545" y="19" class="mono text-muted" font-size="10px">AUDITORIA</text>
      <line x1="0" y1="30" x2="632" y2="30" class="div-line"/>

      <!-- Row 1 (Match Pix) -->
      <g transform="translate(0, 30)">
        <text x="12" y="26" class="mono text-sub">98410294-PIX</text>
        <text x="130" y="26" class="sans text-val">Pix BACEN</text>
        <text x="220" y="26" class="mono text-val" font-weight="600">R$ 1.500,00</text>
        <text x="325" y="26" class="mono text-muted">R$ 14,85 (0.99%)</text>
        <text x="435" y="26" class="mono text-val">R$ 14,85</text>
        <rect x="535" y="12" width="85" height="20" rx="3" class="badge-spi"/>
        <text x="577" y="26" text-anchor="middle" class="mono badge-spi-text">CONCILIADO</text>
        <line x1="12" y1="40" x2="620" y2="40" class="div-line"/>
      </g>

      <!-- Row 2 (Match Stone 3x) -->
      <g transform="translate(0, 71)">
        <text x="12" y="26" class="mono text-sub">40918231-STN</text>
        <text x="130" y="26" class="sans text-val">Stone 3x</text>
        <text x="220" y="26" class="mono text-val" font-weight="600">R$ 3.840,00</text>
        <text x="325" y="26" class="mono text-muted">R$ 145,53 (3.79%)</text>
        <text x="435" y="26" class="mono text-val">R$ 145,53</text>
        <rect x="535" y="12" width="85" height="20" rx="3" class="badge-spi"/>
        <text x="577" y="26" text-anchor="middle" class="mono badge-spi-text">CONCILIADO</text>
        <line x1="12" y1="40" x2="620" y2="40" class="div-line"/>
      </g>

      <!-- Row 3 (DIVERGENCE: Overcharged Cielo) -->
      <g transform="translate(0, 112)">
        <rect width="632" height="40" fill="#2d0a0a" fill-opacity="0.3"/>
        <text x="12" y="26" class="mono text-sub" fill="#fca5a5">77182900-CIE</text>
        <text x="130" y="26" class="sans text-val">Cielo Créd. 1x</text>
        <text x="220" y="26" class="mono text-val" font-weight="600">R$ 980,00</text>
        <text x="325" y="26" class="mono text-muted">R$ 28,32 (2.89%)</text>
        <text x="435" y="26" class="mono" fill="#ef4444" font-weight="700">R$ 39,10 (3.99%)</text>
        <rect x="535" y="12" width="85" height="20" rx="3" class="badge-alert"/>
        <text x="577" y="26" text-anchor="middle" class="mono badge-alert-text">DIVERGÊNCIA</text>
        <line x1="12" y1="40" x2="620" y2="40" class="div-line"/>
      </g>

      <!-- Row 4 (Match Rede Débito) -->
      <g transform="translate(0, 153)">
        <text x="12" y="26" class="mono text-sub">11892301-RED</text>
        <text x="130" y="26" class="sans text-val">Rede Débito</text>
        <text x="220" y="26" class="mono text-val" font-weight="600">R$ 450,00</text>
        <text x="325" y="26" class="mono text-muted">R$ 4,45 (0.99%)</text>
        <text x="435" y="26" class="mono text-val">R$ 4,45</text>
        <rect x="535" y="12" width="85" height="20" rx="3" class="badge-spi"/>
        <text x="577" y="26" text-anchor="middle" class="mono badge-spi-text">CONCILIADO</text>
        <line x1="12" y1="40" x2="620" y2="40" class="div-line"/>
      </g>

      <!-- Row 5 (Match Pix) -->
      <g transform="translate(0, 194)">
        <text x="12" y="26" class="mono text-sub">98410310-PIX</text>
        <text x="130" y="26" class="sans text-val">Pix BACEN</text>
        <text x="220" y="26" class="mono text-val" font-weight="600">R$ 2.100,00</text>
        <text x="325" y="26" class="mono text-muted">R$ 20,79 (0.99%)</text>
        <text x="435" y="26" class="mono text-val">R$ 20,79</text>
        <rect x="535" y="12" width="85" height="20" rx="3" class="badge-spi"/>
        <text x="577" y="26" text-anchor="middle" class="mono badge-spi-text">CONCILIADO</text>
      </g>
    </g>

    <!-- Bottom Alert Box: Automated Dispute Protocol Ticket -->
    <g transform="translate(18, 342)">
      <rect width="632" height="136" rx="6" fill="#15131b" stroke="#7f1d1d" stroke-width="1"/>
      
      <!-- Docket Header -->
      <g transform="translate(16, 20)">
        <rect width="18" height="18" rx="3" fill="#ef4444"/>
        <text x="9" y="13" text-anchor="middle" fill="#ffffff" font-weight="900" font-size="12px">!</text>
        <text x="28" y="14" class="sans text-title" font-size="12px" fill="#fca5a5">PROTOCOLO DE DISPUTA AUTOMÁTICO · CONTESTAÇÃO DE MDR INDEVIDO</text>
      </g>

      <g transform="translate(16, 50)">
        <text x="0" y="14" class="mono text-sub" fill="#cbd5e1">Dossiê Gerado: <tspan fill="#38bdf8">DISP-2026-099014</tspan> | Adquirente: <tspan fill="#f8fafc">Cielo S.A.</tspan> | NSU: <tspan fill="#f8fafc">77182900</tspan></text>
        <text x="0" y="32" class="mono text-sub" fill="#cbd5e1">Taxa Contratada: <tspan fill="#34d399">2.89% (R$ 28,32)</tspan> vs Extrato EDI: <tspan fill="#f87171">3.99% (R$ 39,10)</tspan> → <tspan fill="#ef4444" font-weight="700">Divergência: -R$ 10,78</tspan></text>
        <text x="0" y="50" class="mono text-muted">Ação Executada: Bloqueio contábil da taxa excedente no ledger + Envio de webhook de estorno formal.</text>
      </g>

      <g transform="translate(480, 88)">
        <rect width="136" height="32" rx="4" fill="#ef4444"/>
        <text x="68" y="20" text-anchor="middle" class="mono" fill="#ffffff" font-size="11px" font-weight="700">EXPORTAR PROVA EDI</text>
      </g>
    </g>
  </g>
</svg>
