    <text x="32" y="16" class="sans text-title" letter-spacing="0.5">TITAN CORE BANKING <tspan fill="#34d399" font-size="11px" font-weight="400">| DOUBLE-ENTRY LEDGER &amp; PIX SPI CLEARING</tspan></text>
  </g>

