      <text x="12" y="20" class="mono text-muted" font-size="10px">INVARIANTE DE TRANSIÇÃO (RN-05):</text>
      <text x="12" y="36" class="mono" fill="#38bdf8" font-size="10px">Zero ClickOps · Imutabilidade de histórico · Anti-Drift</text>
