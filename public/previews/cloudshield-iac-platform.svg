<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #070d18; }
      .nav-bg { fill: #0b1526; stroke: #1e293b; stroke-width: 1; }
      .card-bg { fill: #0d1a2d; stroke: #1e2e4a; stroke-width: 1; }
      .card-accent { fill: #10223d; stroke: #203a63; stroke-width: 1; }
      .inner-box { fill: #070e1c; stroke: #192b45; stroke-width: 1; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-feature-settings: "tnum" 1; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-title { fill: #f8fafc; font-size: 14px; font-weight: 600; }
      .text-sub { fill: #94a3b8; font-size: 11px; }
      .text-muted { fill: #64748b; font-size: 11px; }
      .text-num-lg { fill: #38bdf8; font-size: 20px; font-weight: 700; }
      .text-val { fill: #e2e8f0; font-size: 12px; }
      .badge-cis { fill: #064e3b; stroke: #10b981; }
      .badge-cis-text { fill: #34d399; font-size: 10px; font-weight: 700; }
      .badge-fsm { fill: #1e1b4b; stroke: #6366f1; }
      .badge-fsm-text { fill: #a5b4fc; font-size: 10px; font-weight: 700; }
      .div-line { stroke: #1e2e4a; stroke-width: 1; }
