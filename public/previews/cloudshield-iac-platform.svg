      <circle cx="16" cy="20" r="4" fill="#10b981"/>
      <text x="28" y="23" class="sans" fill="#f8fafc" font-size="12px" font-weight="600">stk-core-production</text>
      <text x="28" y="44" class="mono text-muted" font-size="10px">urn:cloudshield:aws:us-east-1:prod:vpc/vpc-titan-mesh (10.0.0.0/16)</text>
