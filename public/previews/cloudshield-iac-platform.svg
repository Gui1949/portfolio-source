    <path d="M12 2 L3 7 V12 C3 17.5 7 22 12 24 C17 22 21 17.5 21 12 V7 L12 2 Z" stroke="#ffffff" stroke-width="1.8" fill="none" transform="scale(0.7) translate(3, 2)"/>
    <text x="32" y="16" class="sans text-title" letter-spacing="0.5">CLOUDSHIELD PLATFORM <tspan fill="#38bdf8" font-size="11px" font-weight="400">| INFRASTRUCTURE AS CODE &amp; POLICY-AS-CODE</tspan></text>
  </g>

  <g transform="translate(510, 16)">
